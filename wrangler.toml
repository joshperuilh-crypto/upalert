name = "upalert"
main = "workers/api/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "upalert-db"
database_id = "YOUR_D1_DATABASE_ID"  # Replace after: wrangler d1 create upalert-db

# KV for rate limiting and caching (optional but useful)
# [[kv_namespaces]]
# binding = "KV"
# id = "YOUR_KV_NAMESPACE_ID"

# Environment variables (set secrets via: wrangler secret put RESEND_API_KEY)
[vars]
ENVIRONMENT = "production"
FRONTEND_URL = "https://upalert.pages.dev"
JWT_SECRET = "change-this-in-production-use-wrangler-secret"

# Cron worker (separate worker for monitoring)
# Deploy with: wrangler deploy --config wrangler.monitor.toml

[[routes]]
pattern = "upalert.pages.dev/api/*"
zone_name = "pages.dev"
